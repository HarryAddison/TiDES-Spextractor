# Output save directory
output_dir: "./outputs"

# Keys relating to the spectrum table columns
# Must be in the order: wavelength, flux, flux err
keys:  ["wave", "flux", "flux_err"] # ["WAVE", "FLUX", "ERR_FLUX"] #

# What is the maximum number of data points allowed in the spectrum.
# Used to limit the amount of data provided to the GP modelling as run
# time increases with data points.
# If number of points greater than the set limit, then the data is binned
# to reduce the number of data points to the limit.
points_limit: 4000

preprocess_binning: False
preprocess_binning_width: 15

# Number of training iterations that the GP model should do.
gp_training_iterations: 2000

# Should the loss plot for the GP training interations be shown and saved?
# If save is True then the plots are saved to the directory given by the "output_dir"
loss_plot_show: False
loss_plot_save: True

# GP model optimisation early stop parameters
# min_delta_loss: The threshold at which to define no significant improvement
#                 is being made by an optimisation interation.
# patience: how many more iterations to do after delta loss
#           becomes smaller than min_delta_loss.
min_delta_loss: 0.0001
patience: 20

# GPR model sampling step.
# The step size in angstrom used to construct the x values of the model.
# np.arange is used with the min and max of the observed spectrum,
# and the step given here.
# WARNING: Reducing the step size will increase run time.
gpr_model_sampling_step: 15

# Host galaxy removal
# host_gal_removal: Should the code model the host galaxy contamination and then remove it?
# fit_wl_bounds: The wavelength range used to fit/model the host galaxy contamination.
#                If a value is None then the boundary is determined from the min/max of the
#                common wavelengths of the galaxy eigenspectra and observed spectrum.
#                Wavelengths must be set within the wavelengths covered by the eigenspectra,
#                which cover between 3500A and 7500A.
# host_gal_removal_plot_show: Should the host galaxy removal plot be shown?.
# host_gal_removal_plot_save: Should the host galaxy removal plot be saved?
#                             If True, plot is saved to the directory given by the "output_dir".
host_gal_removal: True
fit_wl_bounds: [3500, 7500]  
host_gal_removal_plot_show: False
host_gal_removal_plot_save: True

# Spectrum Plotting
plot_tellurics: True

# Normalisation of the spectrum
# Options are:
# - "max": Spectrum is normalised such that the maximum flux is 1.
# - "flux_at_wl": Spectrum is normalised such that the flux at the given
#                 wavelength is 1.
#                 NOTE: Must also provide a value for the wavelength in angstrom)
Normalisation_method: "max"
Normalisation_wavelength: None

# Analysed spectrum plot
# analysed_spectrum_plot_show: Should the plot of the analysed spectrum be shown?
analysed_spectrum_plot_save: Should the plot of the analysed spectrum be saved?
                             If True, plot is saved to the directory given by the "output_dir".
analysed_spectrum_plot_show: True
analysed_spectrum_plot_save: True
